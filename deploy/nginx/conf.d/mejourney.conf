map $http_x_mejourney_token $mejourney_token_allowed {
    default 0;
    include /etc/nginx/secrets/mejourney-token.map;
}

# $ip_allowed is a geo block in nginx.conf shared with wordme.
map "$mejourney_token_allowed:$ip_allowed" $mejourney_allowed {
    default 0;
    "1:0" 1;
    "0:1" 1;
    "1:1" 1;
}
